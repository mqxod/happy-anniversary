<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff1ed">
    <title>A little anniversary surprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="heart-field" id="heartField" aria-hidden="true"></div>
    <main class="page-shell">
      <section class="love-card" id="loveCard" aria-live="polite">
        <div class="card-sparkle sparkle-one" aria-hidden="true">✦</div>
        <div class="card-sparkle sparkle-two" aria-hidden="true">♡</div>
        <div id="stageContent"></div>
      </section>
      <p class="tiny-note" id="tinyNote">Made with an unreasonable amount of love</p>
    </main>
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  </body>
</html>
